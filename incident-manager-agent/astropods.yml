# yaml-language-server: $schema=https://astropods.ai/schema/package.json
spec: package/v1
name: "incident-manager-agent"

agent:
  build:
    context: .
    dockerfile: Dockerfile

models:
  openai:
    provider: openai

inputs:
  SLACK_BOT_TOKEN:
    name: SLACK_BOT_TOKEN
    datatype: string
    secret: true
    description: "Slack Bot OAuth token"
    display-as: short-text
  NOTION_API_KEY:
    name: NOTION_API_KEY
    datatype: string
    secret: true
    description: "Notion integration secret"
    display-as: short-text
  NOTION_DATABASE_ID:
    name: NOTION_DATABASE_ID
    datatype: string
    description: "Notion database ID holding the incident log"
    display-as: short-text

dev:
  interfaces:
    messaging:
      adapters: [web, slack]
