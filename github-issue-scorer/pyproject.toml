[project]
name = "github-issue-scorer"
version = "0.1.0"
description = "LangChain agent that fetches and prioritizes GitHub issues"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "PyGithub>=2.3",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main.py"]
