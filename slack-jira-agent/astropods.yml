# yaml-language-server: $schema=https://astropods.ai/schema/package.json
spec: package/v1
name: slack-jira-agent

agent:
  build:
    context: .
    dockerfile: Dockerfile

models:
  openai:
    provider: openai

inputs:
  JIRA_API_KEY:
    name: JIRA_API_KEY
    datatype: string
    secret: true
    description: "Jira API token for authentication"
    display-as: short-text
  JIRA_USERNAME:
    name: JIRA_USERNAME
    datatype: string
    description: "Jira account email address"
    display-as: short-text
  JIRA_SUBDOMAIN:
    name: JIRA_SUBDOMAIN
    datatype: string
    description: "Jira subdomain (e.g. 'mycompany' for mycompany.atlassian.net)"
    display-as: short-text
  JIRA_PROJECT_ID:
    name: JIRA_PROJECT_ID
    datatype: string
    description: "Jira project key (e.g. 'PROJ')"
    display-as: short-text
  SLACK_SUBDOMAIN:
    name: SLACK_SUBDOMAIN
    datatype: string
    description: "Slack workspace subdomain"
    display-as: short-text
    optional: true

dev:
  interfaces:
    messaging:
      adapters: [web, slack]
